version: v0.4
project:
  name: 'Uniform attachment with freezing: SIR epidemic and infection-tree limits'
  description: >-
    Lean proofs of the local, fluid and terminal geometric limits of the SIR epidemic and its infection
    tree. The selected results include the finite-rate geometric Bienaymé limit, strong-rate non-tightness,
    the finite-rate fluid and height/distance survival mixtures, and the strong-rate fluid, height, distance
    and maximum-height limits. The physical model uses independent exponential recoveries and infection-age
    contact paths; existence for positive rates and the relevant clock-law identifications are proved.
    This entry covers T06–T07 and shares its proof repository with the other main-result groups.
  authors:
