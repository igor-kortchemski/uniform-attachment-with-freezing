fidelity:
  divergences: >-
    The limits use exact finite-word mixtures, frozen-ball transfer, forward fluid estimates and harmonic-charge
    bounds, bypassing the manuscript's Skorokhod and reversed iid-coupling arguments. The physical full-contact
    protocol and its tree/count histories are derived from genuine independent clock data; positive-rate
    existence is proved. Counts directly measure susceptible and infectious individuals. The translation
    between chronological plane trees or all-function locally uniform paths and the article's alternate
    carrier language remains a reviewed representation qualification where not separately formalized.
    Proving the nine conclusions does not certify the skipped reversed-coupling argument; the full correspondence
    and remaining obligations are in the shared reports.
