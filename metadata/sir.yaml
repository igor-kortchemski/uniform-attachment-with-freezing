status:
  scope: >-
    The exact selected targets are in comparator/sir.json: nine main conclusions of T06–T07 and four supporting
    physical-model and existence pins, thirteen comparison targets in total. Rate assumptions, uniform
    sampling of all terminal vertices, the pair diagonal, constants and convergence modes retain their
    source meanings. The model is non-vacuous for every positive rate, with eventual positivity derived
    from the asymptotic assumptions. Chronological plane-tree and locally uniform path-carrier representations
    remain explicit qualifications. The reversed iid coupling A85–A86 and other whole-paper obligations
    remain open despite alternative proofs of the main conclusions. The historical full mechanical report
    at 82f0ad45a60ec785a725fc419082c7d1d779b222 verifies the unchanged interface; the new metadata snapshot
    requires its own full preflight.
