# Per-entry metadata; prepared locally with the user-approved title.
version: v0.4
project:
  name: 'Uniform attachment with freezing: equivalence in law of the forward and reversed constructions'
  description: >-
    Lean proof that the forward uniform-attachment/freezing construction and the reversed growth-coalescent
    construction give the same distribution of labelled rooted trees, after the prescribed erasure of
    active reverse labels. The equality includes the extinction endpoint. It is stated on a canonical
    encoding that retains the complete graph and relevant labels. The dictionary to literal isomorphism-class
    language is mathematically reviewed but is not an additional Lean quotient-law equivalence theorem.
    This entry covers T05 and shares its proof repository with the companion asymptotic and SIR entries.
  authors:
  - Igor Kortchemski
  responsible_maintainers:
  - Igor Kortchemski
  license: Apache-2.0
