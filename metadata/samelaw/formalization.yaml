fidelity:
  divergences: >-
    The implementation follows the precise signs and ordered-root merging in Algorithm 2 rather than the
    sign-swapped introductory sentence. Equality is proved through actual supported canonical states and
    complete probability masses, using the corrected schedule-compatible support in place of the false
    printed L04 support claim. The canonical observable retains the complete source tree information,
    but the full translation to laws on a separately defined quotient of isomorphism classes is a reviewed
    representation qualification rather than an extra compared theorem. The complete argument and source
    corrections remain documented in the correspondence and coverage report.
