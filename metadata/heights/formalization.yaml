    lean: Freezing1.linear_heightScale_tendsto
    module: Freezing1.MainLinearHeightScale
    status: proved
    note: Exact nested-limit source hypotheses and real cutoff; Abel proof for the central block.
  - source: thm:lineaire II, height assertion, lines 326–334
    lean: Freezing1.linear_uniform_height_tendsto_Lp
    module: Freezing1.MainLinearUniformHeight
    status: proved
    note: Actual uniform sampling among all vertices, including frozen vertices, every real p at least
