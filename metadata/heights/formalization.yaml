fidelity:
  divergences: >-
    The universal height limits are proved by direct forward exponential-moment arguments rather than
    the manuscript's reversed construction. The linear-regime conclusions use forward cut-forest estimates
    and tagged continuation; the literal general-process form of L13 is bypassed and remains open. The
    specified height factor is pinned by existence, uniqueness and its defining equation. Other repaired
    source auxiliaries and proof departures are recorded in FORMALIZATION_REPORT.md and verification/certification/OPEN_OBLIGATIONS.md;
    proving these conclusions does not certify every printed argument.
