# Per-entry metadata; prepared locally with the user-approved title.
version: v0.4
project:
  name: 'Uniform attachment with freezing: height and distance asymptotics'
  description: >-
    Lean proofs of the height and distance asymptotics for uniform attachment trees with freezing in Uniform
    attachment with freezing. The selected results are the three parts of the universal height theorem
    and the four conclusions of the linear-growth theorem: the deterministic height scale, uniform-vertex
    height, independent-pair distance and maximum-height limits. Sampling includes frozen vertices where
    required and coincident pairs. This entry covers T03–T04; the companion local-limit, construction-equivalence
    and SIR results use separate entries from the same repository.
  authors:
  - Igor Kortchemski
  responsible_maintainers:
  - Igor Kortchemski
  license: Apache-2.0
