name = "freezing1"
version = "0.1.0"
defaultTargets = ["Freezing1", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Freezing1"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge", "Challenge.+"]

[[lean_lib]]
name = "Solution"
globs = ["Solution", "Solution.+"]
