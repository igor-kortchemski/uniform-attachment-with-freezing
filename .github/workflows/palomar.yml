name: Palomar full mechanical preflight

# Dispatch only after the intended snapshot is public. This workflow does not submit or register a
# result; inspect its mechanical-report.json afterwards. Palomar accepts one comparator configuration
# per submission, so dispatch it once per interface, with a distinct request id each time:
#   comparator/heights.json    (T03, T04)
#   comparator/locallimits.json (T01, T02)
#   comparator/samelaw.json    (T05)
#   comparator/sir.json        (T06, T07)
# Exact-source run status and reports are tracked in verification/certification/palomar/.
# Per-entry titles and scopes come from the matching metadata/<entry>/formalization.yaml file.
# Obtain the user's check of the exact proposed actions before dispatching this workflow.
on:
  workflow_dispatch:
    inputs:
      comparator_config:
        description: "Comparator configuration of this submission"
        required: true
        type: choice
        options:
          - comparator/heights.json
          - comparator/locallimits.json
          - comparator/samelaw.json
          - comparator/sir.json
      request_id:
        description: "Exactly 12 lowercase letters or digits, distinct for each interface"
        required: true
        type: string
      authorization_relationship:
        description: "Truthful relationship to the formalization (recorded in the report)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !github.event.repository.private }}
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        ${{ format(
          '{{"comparator_config_path":{0},"formalization_metadata_path":{1},"authorization_relationship":{2}}}',
          toJSON(inputs.comparator_config),
          toJSON(fromJSON('{"comparator/heights.json":"metadata/heights/formalization.yaml","comparator/locallimits.json":"metadata/locallimits/formalization.yaml","comparator/samelaw.json":"metadata/samelaw/formalization.yaml","comparator/sir.json":"metadata/sir/formalization.yaml"}')[inputs.comparator_config]),
          toJSON(inputs.authorization_relationship)
        ) }}
