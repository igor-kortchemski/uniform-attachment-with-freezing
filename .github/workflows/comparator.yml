name: Comparator

# Sandboxed Comparator (Lake `comparator`) for every main-result interface. One configuration per
# step: Palomar accepts a single comparator configuration per submission, so each of the four
# interfaces is also a separate Palomar submission (see palomar.yml). Nothing is uploaded or registered.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test verification failure propagation (mock checkers)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p test_verification.py -v
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: false
          large-packages: false
          swap-storage: false
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: false
          build: false
      - name: Install the pinned Palomar Bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config apparmor
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/checkers"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            --output "$RUNNER_TEMP/downloads/install_bwrap.sh" \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarSubmission/14aa8d6b3c2f14a8540605e37144560b9a00e7e7/scripts/install_bwrap.sh
          printf '%s  %s\n' c290df6cebdf1cb26edb69ed4164d9551062bfeb65243b93d1d1d3b77eac0a35 \
            "$RUNNER_TEMP/downloads/install_bwrap.sh" | sha256sum --check --quiet
          comparator_bwrap=$(bash "$RUNNER_TEMP/downloads/install_bwrap.sh" "$RUNNER_TEMP/checkers/bwrap")
          echo "$RUNNER_TEMP/checkers/bwrap" >> "$GITHUB_PATH"
          echo "COMPARATOR_BWRAP=$comparator_bwrap" >> "$GITHUB_ENV"
          "$comparator_bwrap" --unshare-all --new-session --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - name: Check the committed manifest
        run: |
          set -euo pipefail
          sha256sum --check MANIFEST.sha256 > "$RUNNER_TEMP/freezing1-manifest.log"
      - name: Build, audit and run sandboxed Comparator with NanoDa
        run: scripts/run-linux-checks.sh "$RUNNER_TEMP/freezing1-linux-checks"
      - name: Keep exact-commit Linux diagnostics, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freezing1-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/freezing1-manifest.log
            ${{ runner.temp }}/freezing1-linux-checks
          if-no-files-found: warn
