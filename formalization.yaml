fidelity:
  divergences: >-
    The original height-scale bound uses direct count comparison; the actual
    adjacent-swap iteration and sorted harmonic proof are now checked separately. Bernoulli concentration is proved by
    a Chernoff/MGF argument. The universal height theorem uses direct forward
    averaging, MGF estimates, Jensen and Holder/truncation, bypassing the reverse
    representation and construction equivalence. The reverse representation has
    since been proved separately, including actual-history independence. The actual finite
    maximum upper bound retains a one-edge shift and the n+1 factor, then absorbs
    them asymptotically. The paper's real-power integration-by-parts argument is
    replaced by a proved logarithmic envelope; actual real layer-cake, the split
    at seven, exact dilation and the tail asymptotic are checked. The finite
    adjacent-swap iteration and sorted harmonic proof are also checked separately.
    The original uniform block estimate uses Abel summation. The source
    geometric strategy is now checked separately, with the proved restriction
    beta<C and a vanishing last-endpoint integer-rounding correction. Three
    false printed finite steps are formally refuted. Uniform-all-vertex height uses an
    exact forward birth mixture and active-height stochastic monotonicity;
    the reverse random-mean representation, conditional expectation and mean
    normalization have since been checked separately. The mean limit uses a
    fixed fractional birth cutoff and bulk tail bound, while the corrected
    harmonic calculation is checked separately. The literal conditional
    Bennett/layer-cake and random-mean domination argument is now proved.
    C01 replaces the cited external tangent count by an actual largest-label
    growth bijection and formal exponential/Bernoulli coefficient argument.
    Poisson lower tails originally use a strict floor-plus-one/Stirling
    argument. The exact printed cubic probability bound and polynomial scale
    are now checked separately, with explicit small-threshold handling. The
    printed real ceiling-factorial and all-margin positive-slack claims are
    refuted; safe thresholds repair the all-margin witness. Le Cam event estimates are proved directly by
    convolution comparison, including parameter drift. Reverse block counts are
    identified with the actual forward cut-forest counts. Pair tails and
    variance use a direct product supersolution of the actual kernel; the
    actual auxiliary Bernoulli augmentation, entire independent driver words
    and genuine monotone thinning are now proved; final mismatch/tail assembly
    and independent review are active. The incorrect current-merge prose is
    formally refuted. The maximum lower
    bound originally uses the true tagged continuation and finite-permutation second moments,
    integrates joint failure events, and sums the exact errors. The initial good
    population uses coefficient c/4 and the true bound S_a at most a+1. The full
    past/bare-forest conditional mean and variance bypassed by this route have
    since been proved separately from actual supported uniform rematching.
    Distinct-component conditional covariance, same-component marks and the
    complete Chebyshev/tower/normalized uniform consumer are now proved
    separately, retaining the true population bound and exact positive indices.
    T01 uses the true pre-step freezing hazards and a proved comparison with the
    printed post-step reciprocal series. Frozen-ball stabilization and a genuine
    prefix coupling give sufficiency; a direct exponential root-degree estimate
    and marginal non-tightness give necessity. The corrected actual conditional
    attachment independence and second Borel-Cantelli argument have since been
    checked separately, with pre-step hazards and strictly post-birth indices.
    The increasing matching-prefix extraction, actual pair couplings and
    all-vertex degree obstruction are now checked separately. The final
    manuscript union-event inference for the nonmonotone diagonal sequence
    is replaced by marginal finite-ball tail tightness. The subtree expectation identities
    of the branching proof, including its exact normalizing function, are now
    checked from the actual finite-child law; the rectangle-induction proof order
    is retained. Full augmented-forest exchangeability,
    past independence and true uniform root matching are proved; the source bare
    star convention erases root freezing clocks and its full-state interpretation
    is explicitly corrected. SIR local limits use exact
    adaptive finite-word mixtures and frozen-ball transfer, while strong-rate
    non-tightness uses root-degree escape, avoiding the source Skorokhod route.
    Unstopped SIR fluid convergence uses proved exponential noise bounds and
    an adapted Gronwall reduction with the general-rate error retained. The
    source's future-maximum Gronwall criterion is false and is refuted separately.
    Finite-rate SIR geometry uses finite-constraint diagonal uniformization of
    T04 and exact terminal subset sampling, replacing the printed Skorokhod and
    birth-time shortcut. Strong late-height control uses forward harmonic charge
    budgets and a cut-height exponential sum, replacing the unverified reversed
    walk coupling. Physical history is derived from one original independent
    clock array and the actual whole-contact next-point protocol; exponential
    first delays and history residual products are conclusions, not premises.
    Birth labels implement the missing shift in one
    sentence of the source proof. Several printed claims are false without
    correction; none is silently weakened or marked proved.
