version: v0.4
project:
  name: "Uniform attachment with freezing — partial formalization"
  description: >-
    An incomplete Lean formalization of Uniform attachment with freezing.
    All three parts of the Introduction's universal height theorem are proved
    for the actual forward random-tree distribution, including every real Lp
    exponent. The linear-regime height scale and uniform-all-vertex height
    and pair-distance limits are proved, as is its maximum-height limit in probability. Forward and reverse graph
    constructions, coherent reverse histories, independent height increments,
    corrected coalescence-time and maximum-tail laws, uniform-pair coalescence
    limits, actual history point masses, and Poisson approximation are checked.
    The full local-convergence criterion and common limit law in T01 are proved. The actual iid-sign geometric Bienaymé identification T02 is proved, including chronological ordering and p=0. All SIR local, fluid and terminal geometry conclusions are proved, including finite-rate shared-survival height/distance mixtures. The actual full contact protocol is identified with the embedded model from supplied independent recovery and Poisson process data. The rate asymptotics imply eventual positive intensity. Construction equivalence (T05) is
    proved, with the exact active-label fibres and corrected forward support.
    The degree/local-convergence criterion, corrected conditional attachment
    independence and Borel-Cantelli argument, and exact uniform-active Bernoulli
    concentration are also checked. Remaining intermediate source claims and
    the final publication verification are explicitly unresolved in the report.
  authors: [Igor Kortchemski]
  responsible_maintainers: [Igor Kortchemski]
  license: Apache-2.0
classification:
  arxiv: [math.PR, math.CO]
  msc2020: [60C05, 05C80, 60F05]
