status:
  scope: >-
    All named and substantive source claims remain in scope. Current proofs
    include the three parts of thm:height, thm:lineaire I and both II
    assertions, the full maximum-height limit in III, and supporting results including the
    exact uniform logarithmic block estimate. The birth-time law is linked
    to uniform vertex selection in the actual reverse tree. The full-history
    conditional increment law and fixed-vertex Bernoulli representation are
    proved; corrected coalescence and maximum-tail statements are distinguished
    from the source's false literal assertions. T05 and corrected L04 support are
    proved, including the extinction endpoint. L09 includes diagonal and active
    labels; a stronger logarithmic coalescence estimate is also proved. The L12
    first-moment estimate, L10 concentration and L11 component maximum are proved for the actual
    forward cut-forest count, via the verified timestamp-preserving cut law.
    Source defects and all remaining obligations are explicit in the report.
    T01 is proved for the actual infinite trajectory and diagonal laws, with no
    survival hypothesis on the approximating schedules. T02 is proved on the actual iid-sign history, with its concrete geometric
    offspring law and full joint branching property, including p=0 and extinction.
    Every T06 and T07 conclusion is proved for the embedded model and the given
    full-contact source model. This includes the finite-rate height/distance weak
    mixtures and all strong-regime geometry limits. Complete physical tree/count
    history and terminal laws are derived, with source process data only eventually.
    Complete fixed-word original-forward histories and the physical count/tree
    prefixes are now identified jointly. P01 is proved on the actual unordered
    rooted-tree quotient, with constructed unique canonical representatives.
    The A40 independent birth/Bernoulli representation and conditional mean are
    proved, as are the A41 logarithmic birth-tail and all-real-Lp mean limits.
    A28 includes unique consecutive relabelling, raw iid extinction/drift and
    the source local criterion. A40–A43 include the literal conditional
    Bennett/layer-cake argument, the expected integral and final height limit.
    Both SIR physical rate branches and complete joint histories are proved.
    C01 is proved on the actual unordered class with the full tangent and
    Bernoulli formulas. The full unordered local topology A20 and repaired
    geometric-block route A37–A38 are proved. The chronological-main-model
    closed embedding and faithful weak-law transport are now proved; T01/T02
    also have full source-ambient consumers and scoped independent review. Actual full-forest conditional covariance and normalized
    Chebyshev growth are proved; the exact final uniform source consumer is independently reviewed.
    The actual positive infinite urn extension, complete path laws and exact
    budgets are proved, as is the quantitative cubic Poisson lower bound and
    repaired polynomial scale. Two additional false scalar auxiliaries are
    formally refuted. The exact scalar interleaved-chain factorizations and source infinite-urn
    component union route are also checked, with proof-order and marked-root
    corrections retained. The standalone auxiliary iid half-slope probability
    and harmonic expectation are checked. Actual complete component paths and
    the full auxiliary Bernoulli coupling/thinning route are proved. The exact
    finite-survival-conditioned iid row coupling supplies both literal linear
    assumptions. The SIR same-epsilon capture estimate is proved for actual
    reverse clocks, native prefix membership and two conditional uniform samples.
    The Bennett-rate asymptotic and corrected fixed-word conditional tail,
    including its zero-charge branch, are checked. Genuine reversed epidemic
    domination remains open. Remaining intermediate claims are retained explicitly;
    no whole-paper completion is claimed.
    The requested T01–T02 milestone is complete; CLAUDE_HANDOFF.md records
    current checks and the remaining whole-paper obligations.
    This is not a verified whole-paper publication candidate. A scoped
    certification interface for the seven main theorems T01-T07 (twenty
    conclusions) is prepared in Challenge/, Solution/ and comparator/*.json,
    split into four configurations (local limits T01-T02, heights T03-T04,
    same law T05, SIR T06-T07) because Palomar accepts one configuration per
    submission. It is not a certification of every assertion of the
    manuscript: verification/certification/OPEN_OBLIGATIONS.md lists what
    remains open (A85-A86, literal L13, A06 GHP/dendron, A87 stochastic
    domination, A24/A67/A73 couplings) and the statements that are false as
    printed (L03, L04, P03 upper). The official Comparator, the Linux
    sandbox, independent kernel checks other than the toolchain's local
    replays, and the Palomar mechanical report have not been run. Nothing has
    been uploaded and no visibility was changed. The counts of proof holes
    below concern the implementation (Freezing1) and the Solution modules; the
    Challenge modules contain deliberate theorem holes exactly at the
    Comparator targets and nowhere else.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
